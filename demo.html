<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>青禾 · 图书馆空间助手</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5ed;color:#142d26;font:17px/1.6 "Microsoft YaHei",sans-serif}main{max-width:1040px;margin:auto;padding:40px 24px}h1{font-size:clamp(28px,5vw,52px);line-height:1.15;margin:12px 0}small{color:#34594e}section{background:white;border:1px solid #dce6da;padding:22px;margin-top:18px;border-radius:14px}textarea,button,select{font:inherit}textarea{width:100%;min-height:94px;padding:12px;border:1px solid #8eaaa0;border-radius:8px;margin:8px 0}button,select{border:1px solid #55796e;border-radius:7px;padding:7px 12px;margin:3px 4px 3px 0;background:#f1f7ef;color:#142d26;cursor:pointer}button[type=submit]{background:#155843;color:white}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}#answer{white-space:pre-wrap}a{color:#155843}summary{cursor:pointer}
.place{padding:13px 0;border-top:1px solid #dce6da}.place p{margin:4px 0}input{font:inherit;width:72px;padding:6px}#planner{display:flex;flex-wrap:wrap;align-items:center;gap:10px}</style><main><small>开源 AI 技术实践 / 路径 A</small><h1>青禾 · 图书馆空间助手</h1>
<p>输入人数和用途，查找合适的学习空间和预约规则。全部场地与规则为模拟资料。 <a href="/slides" target="_blank">打开汇报幻灯片</a></p>
<section id="planning"><small>模拟演示日 · 每个时段一小时</small>
<h2>查空位并预约</h2><p>比较满足人数和用途的场地，查看可预约时段。预约后可在「我的预约」中取消。</p>
<form id="planner"><label>人数 <input id="seats" type="number" required min="1" max="99" value="4"></label>
<label>用途 <select id="use"><option value="discussion">小组讨论</option><option value="quiet">安静自习</option></select></label>
<label>时段 <select id="slot"><option>09:00</option><option selected>14:00</option><option>19:00</option></select></label>
<button type="submit">比较场地</button></form>
<p id="plan-status" role="status">先选择人数、用途和时段。</p><div id="choices"></div>
<h3>我的预约</h3><div id="bookings">正在读取…</div></section>
<section><h2>问青禾</h2><p>可以问开放时间、预约规则或学习地点。补充人数和用途时，助手会沿用上一条未完成的需求。</p><form id="form"><label for="q">你的学习需求</label><textarea id="q" maxlength="600" required placeholder="例如：我们 4 人想讨论课程项目，去哪儿？"></textarea>
<div id="examples"></div><label for="mode">运行模式 </label><select id="mode"><option value="offline">离线演练（规则驱动）</option><option value="online">在线智能体（模型驱动）</option></select>
<button type="submit" id="run">查找空间</button></form></section>
<section><strong>建议与依据</strong><p id="answer" role="status">等待输入。</p><details open><summary>工具调用记录 <span id="count"></span></summary><div id="trace"></div></details></section>
</main><script>
const el=id=>document.getElementById(id);
for(const q of ['4 人讨论，需要预约吗？','2 人安静自习，有推荐吗？','12 人小组讨论，有合适地点吗？','图书馆几点开放？','想找个学习空间。']){
 const b=document.createElement('button');b.type='button';b.textContent=q;b.onclick=()=>{el('q').value=q;el('q').focus()};el('examples').append(b);
}
const session=localStorage.getItem('qinghe-session')||crypto.randomUUID();
localStorage.setItem('qinghe-session',session);
async function plannerRequest(path, payload={}){
 const response=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session,...payload})});
 const data=await response.json();
 if(!response.ok)throw Error(data.error||'操作失败');
 return data.items;
}
function row(target,title,description,action,handler){
 const item=document.createElement('article');item.className='place';
 const name=document.createElement('strong');name.textContent=title;
 const detail=document.createElement('p');detail.textContent=description;item.append(name,detail);
 if(action){const b=document.createElement('button');b.type='button';b.textContent=action;
  b.onclick=async()=>{b.disabled=true;try{await handler()}catch(e){el('plan-status').textContent=e.message}finally{b.disabled=false}};
  item.append(b);
 }
 target.append(item);
}
function showBookings(items){
 const target=el('bookings');target.replaceChildren();
 if(!items.length)target.textContent='暂无预约。';
 for(const item of items)row(target,item.space,item.slot+' · '+item.seats+' 人 · 编号 '+item.id.slice(0,8),'取消预约',async()=>{
   if(!confirm('取消 '+item.slot+' 的'+item.space+'预约？'))return;
   showBookings(await plannerRequest('/cancel',{id:item.id}));
   await compare();
   el('plan-status').textContent='预约已取消，场地状态已刷新。';
 });
}
async function compare(){
 const query={seats:el('seats').valueAsNumber,discussion:el('use').value==='discussion',slot:el('slot').value};
 const target=el('choices');target.replaceChildren();
 const items=await plannerRequest('/plan',query);
 const free=items.filter(s=>s.available).length;
 el('plan-status').textContent=items.length?query.slot+' 有 '+free+' 个可预约场地，符合条件的场地共 '+items.length+' 个。':'没有满足人数和用途的场地。可尝试拆组或调整用途。';
 if(items.length&&!free){
  for(const option of el('slot').options){
   if(option.value===query.slot)continue;
   const alternative=await plannerRequest('/plan',{...query,slot:option.value});
   if(alternative.some(s=>s.available)){
    row(target,'换个时段',option.value+' 有符合条件的空位','查询 '+option.value,async()=>{el('slot').value=option.value;await compare()});
    break;
   }
  }
 }
 for(const place of items)row(target,place.name+' · '+place.id,place.location+' · '+place.seats+' 人 · '+(place.available?'可预约':'已占用'),place.available?'模拟预约':null,async()=>{
  if(!confirm('确认模拟预约 '+query.slot+' 的'+place.name+'？'))return;
  showBookings(await plannerRequest('/book',{...query,space:place.id}));
  await compare();
  el('plan-status').textContent='模拟预约已确认，详情见「我的预约」。';
 });
}
el('planner').onsubmit=e=>{e.preventDefault();compare().catch(e=>{el('plan-status').textContent=e.message})};
plannerRequest('/bookings').then(showBookings).catch(e=>{el('bookings').textContent=e.message});
let pending='';
el('form').onsubmit=async e=>{
 e.preventDefault();el('run').disabled=true;el('answer').textContent='正在处理…';el('trace').replaceChildren();el('count').textContent='';
 try{
  const input=el('q').value.trim();
  const question=pending&&!/开放|几点|预约规则/.test(input)?pending+' '+input:input;
  const r=await fetch('/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question,mode:el('mode').value})});
  const d=await r.json();pending=r.ok&&d.follow_up?question.slice(-350):'';el('answer').textContent=d.error||d.answer;el('count').textContent='（'+(d.trace||[]).length+' 次'+(d.mode==='offline'?' · 规则驱动':d.mode==='online'?' · 模型驱动':'')+'）';
  for(const [i,t] of (d.trace||[]).entries()){
   const row=document.createElement('details'), title=document.createElement('summary'),pre=document.createElement('pre');
   title.textContent=(i+1)+'. '+t['工具'];pre.textContent=JSON.stringify(t,null,2);row.append(title,pre);el('trace').append(row);
  }
 }catch{el('answer').textContent='无法连接本地服务，请确认 python app.py 正在运行。'}finally{el('run').disabled=false}
};
</script></html>
